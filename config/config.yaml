species_table: "config/species.csv"

hifiasm:
  threads: 32
  extra: ""

compleasm:
  lineage: eudicotyledons_odb12
  library_path: mb_downloads 

genomescope2:
  threads: 16
  hash_size: 20000000000

blobtoolkit:
  blastn_nal: /netscratch/dep_mercier/grp_marques/Aaryan/blastdb_local/ncbi/nt.nal
  blastp_dmnd: /opt/share/blastdb/ncbi-diamond/nr.dmnd
  blastx_dmnd: /opt/share/blastdb/ncbi-diamond/nr.dmnd
  taxdump: /opt/share/blastdb/taxonomy/new_taxdump
  nextflow_work_base: /netscratch/dep_mercier/grp_marques/Aaryan/reproducible_phd/nextflow_work
  nextflow_revision: 0.10.1


  # HapHiC pass-2 per-species tuning. Recorded here so every run's params are
# version-controlled. Empty/absent = no extra flags.
haphic_pass2_extra:
  Drosera_binata: ""
  Drosera_scorpioides: "--correct_nrounds 5 --region_len_ratio 0.5 --remove_allelic_links 4 --max_inflation 10"

# HapHiC pass-1 per-species tuning. scorpioides (autotetraploid) needs
# allelic-link removal + assembly correction or MCL fuses chromosomes.
haphic_pass1_extra:
  Drosera_scorpioides: "--correct_nrounds 5 --region_len_ratio 0.5 --remove_allelic_links 4 --max_inflation 10"

# ---- Annotation ----
annotation_table: "config/annotation.csv"
external_genomes_table: "config/external_genomes.csv"
annotation:
  tiberius_sif: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/tiberius_latest.sif"
  helixer_sif: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/helixer_docker/helixer-docker_helixer_v0.3.6_cuda_12.2.2-cudnn8.sif"
  gffread: "/opt/share/software/bin/gffread"
  agat_env: "/netscratch/dep_mercier/grp_marques/Aaryan/micromamba_envs/agat_env"
  annevo_env: "/netscratch/dep_mercier/grp_marques/Aaryan/micromamba_envs/annevo_v232"
  annevo_repo: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/ANNEVO"
  annevo_model: "saved_model/ANNEVO_Magnoliopsida.pt"
  omamer_db_luca: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/omark_db/LUCA.h5"
  omamer_db_viridiplantae: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/omark_db/Viridiplantae.h5"
  braker4_repo: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/BRAKER4"
  braker4_env: "/netscratch/dep_mercier/grp_marques/Aaryan/micromamba_envs/braker4"
  braker4_cache: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/BRAKER4/.singularity_cache"
  orthodb_viridiplantae: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/orthodb/Viridiplantae.fa"
  braker4_busco_lineage: "eudicotyledons_odb12.2"
# ---- Repeats (CARP: TEs, satellites, 45S/5S rDNA) ----
# One CARP run per species on the frozen two-haplotype {species}_chr.fa
# (workflow/rules/repeats.smk). Image fetched by scripts/fetch_carp_sif.sh.
repeats:
  carp_version: "1.9.5"
  carp_sif: "/netscratch/dep_mercier/grp_marques/Aaryan/methods/carp/carp_1.9.5.sif"
  # every species in config/annotation.csv, in its order (was [Drosera_paradoxa, Drosera_binata])
  species:
    - Drosera_paradoxa
    - Drosera_binata
    - Drosera_scorpioides
    - Drosera_roseana
    - Drosera_aliciae
    - Drosera_tokaiensis
    - Drosera_filiformis
    - Drosera_capensis
    - Drosera_regia
    - Dionaea_muscipula
    - Nepenthes_gracilis
  repeatmasker_sensitivity: default
  # rmblastn culling for the genome-wide RepeatMasker step: CARP's recommended
  # 2 is ~3x faster at -0.7% masked bp. Left OFF (0) for the tandem-repeat
  # remasking, which CARP warns can under-mask large satellite arrays.
  repeatmasker_culling_limit: 2
  tidecluster_reannotate_culling_limit: 0
  # CARP's density-track (BigWig) steps: at most this many workers at once (CARP's 0 = one per thread)
  bigwig_max_workers: 16
  resources:
    # Both species on a whole node (127 cores, 900 GB), 4-day limit. carp_extra goes to CARP's own Snakemake:
    #   --keep-going: a failed side step (density tracks, the HTML report) does not stop the annotation;
    #     repeats.smk accepts a run whose Repeat_Annotation_Unified.gff3 and summary_statistics.csv are complete.
    #   --set-threads dante=64: DANTE forks one copy of itself per worker; 127 copies ran out of the memory
    #     the node could commit (strict overcommit: ~1.2 TB per node, every fork counted in full).
    #   --set-threads dante_ltr/dante_tir/dante_line/dante_tir_fallback=63: two of them run side by side
    #     (DANTE_LTR and DANTE_TIR averaged ~8 and ~3 cores on binata). CARP's results do not depend on threads.
    #   --set-resources tidecluster_*:mem_mb=8192: TideCluster's memory budget becomes 8 GB, which caps TAREAN
    #     at one thread per satellite family, so R makes no forked copies of itself (binata, 2026-10-14).
    #     TideHunter ignores this budget while the genome splits into no more parts (genome x 1.1 / 50 Mb)
    #     than threads: paradoxa ~97, binata ~32.
    default: {threads: 127, mem_mb: 900000, partition: normal, time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=64 dante_ltr=63 dante_tir=63 dante_line=63 dante_tir_fallback=63 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    # Per species (2026-10-29): DANTE forks one worker per thread, and under strict overcommit each fork is
    # charged ~3.5 GB per Gb of genome. Capped so DANTE's forks fit in 250 GB: at 64 workers roseana,
    # Dionaea and scorpioides failed with Errno 12 on nodes with 200-358 GB of commit room. The worker
    # count changes speed, not results. hpc09 excluded: 960 of 1142 GB committed outside Slurm.
    Drosera_scorpioides: {threads: 127, mem_mb: 900000, partition: "normal", time: "7-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=10 dante_ltr=10 dante_tir=10 dante_line=10 dante_tir_fallback=10 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_roseana: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=19 dante_ltr=19 dante_tir=19 dante_line=19 dante_tir_fallback=19 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_aliciae: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=43 dante_ltr=43 dante_tir=43 dante_line=43 dante_tir_fallback=43 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_tokaiensis: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=44 dante_ltr=44 dante_tir=44 dante_line=44 dante_tir_fallback=44 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_filiformis: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=27 dante_ltr=27 dante_tir=27 dante_line=27 dante_tir_fallback=27 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_capensis: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=64 dante_ltr=63 dante_tir=63 dante_line=63 dante_tir_fallback=63 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Drosera_regia: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=64 dante_ltr=63 dante_tir=63 dante_line=63 dante_tir_fallback=63 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Dionaea_muscipula: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=31 dante_ltr=31 dante_tir=31 dante_line=31 dante_tir_fallback=31 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
    Nepenthes_gracilis: {threads: 127, mem_mb: 900000, partition: "normal", time: "4-00:00:00", exclude: "hpc04,hpc07,hpc08,hpc09,hpc15", carp_extra: "--keep-going --set-threads dante=64 dante_ltr=63 dante_tir=63 dante_line=63 dante_tir_fallback=63 --set-resources tidecluster_long:mem_mb=8192 tidecluster_short:mem_mb=8192"}
